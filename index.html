<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TravelBloom</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="logo">
            <i class="fa-solid fa-plane"></i>
            <span>TravelBloom</span>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact Us</a>
        </nav>

        <div class="search-box">
            <input 
                type="text" 
                id="searchInput"
                placeholder="Enter a destination or keyword"
            >
        
            <button class="search-btn" onclick="searchPlaces()">
                Search
            </button>
        
            <button class="clear-btn" onclick="clearResults()">
                Clear
            </button>
        </div>
        
        
    </header>

    <!-- HERO SECTION -->
    <section class="hero">
        <div class="overlay"></div>

        <!-- SOCIAL ICONS -->
        <div class="social-icons">
            <i class="fab fa-twitter"></i>
            <i class="fab fa-facebook-f"></i>
            <i class="fab fa-instagram"></i>
            <i class="fab fa-youtube"></i>
        </div>

        <!-- CONTENT -->
        <div class="hero-content">
            <h1>
                EXPLORE<br>
                DREAM<br>
                DESTINATION
            </h1>

            <p>
                It encourages exploration of unfamiliar territories, embracing diverse
                cultures and landscapes, while pursuing the desired destination that
                captivates the heart and ignites a sense of wonder.
            </p>

            <button class="book-btn">BOOK NOW</button>
        </div>
    </section>
    <section id="results" class="results-section"></section>
<script src="script.js"></script>
</body>
</html>
